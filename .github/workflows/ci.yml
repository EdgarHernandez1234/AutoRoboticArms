name: AutoRoboticArms Ecosystem CI/CD

# 1. TRIGGER GATEWAYS
on:
  push:
    branches: [ "main", "dev", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =====================================================================
  # JOB 1: OPTION A (FIRMWARE & SILICON CONTROL)
  # =====================================================================
  firmware-sil-validation:
    name: C++ Firmware Software-in-the-Loop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install C++ Toolchains
        run: sudo apt-get update && sudo apt-get install -y cmake g++ gcc-avr avr-libc
        
      - name: Build & Execute CMake Integration Pipeline
        run: |
          mkdir -p build
          cd build
          cmake ..
          make
          ./test_integration_pipeline

  # =====================================================================
  # JOB 2: OPTION B & C (PYTHON MICROSERVICES & CLOUD DATA PLANE)
  # =====================================================================
  python-backend-validation:
    name: ASGI Gateway & Cloud Sync Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Supply-Chain Vulnerability Audit
        run: |
          pip install pip-audit
          pip-audit -r Cloud/requirements.txt
          
      - name: Install Dependencies & Run Pytest
        run: |
          pip install -r Cloud/requirements.txt
          pytest Cloud/tests/ -v

  # =====================================================================
  # JOB 3: OPTION B & C (CONTAINERIZATION HARDENING)
  # =====================================================================
  container-build-audit:
    name: Multi-Stage OCI Image Build
    runs-on: ubuntu-latest
    needs: [python-backend-validation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Hardened Docker Image
        run: |
          cd Cloud
          docker build -t autoroboticarms-cloud:ci-test .